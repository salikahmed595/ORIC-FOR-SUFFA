<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #efeef1 0%, #e4e3e7 100%);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  #root { min-height: 100vh; }
  button { font: inherit; }
  input, textarea { font: inherit; }
  /* hide scrollbars inside the phone */
  .dsu-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  .dsu-scroll::-webkit-scrollbar { display: none; }

  /* press / tap feedback */
  .dsu-press { transition: transform .08s ease; }
  .dsu-press:active { transform: scale(.97); }
  .dsu-card-tap { transition: filter .12s ease, transform .08s ease; }
  .dsu-card-tap:active { filter: brightness(.97); }

  /* range slider */
  .dsu-range { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:#E8E8E8; accent-color:#6B1A1A; outline:none; }
  .dsu-range::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:22px; height:22px;
    border-radius:50%; background:#6B1A1A; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); cursor:pointer; }
  .dsu-range::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#6B1A1A; border:3px solid #fff; cursor:pointer; }

  /* spinner */
  .dsu-spin { width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:dsu-rotate .8s linear infinite; }
  @keyframes dsu-rotate { to { transform: rotate(360deg); } }

  @keyframes dsu-fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .dsu-fade { animation: dsu-fadein .35s ease both; }
  @keyframes dsu-popin { 0% { opacity:0; transform:scale(.8); } 60% { opacity:1; transform:scale(1.06); } 100% { transform:scale(1); } }
  .dsu-pop { animation: dsu-popin .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes dsu-shakex { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .dsu-shake { animation: dsu-shakex .4s both; }
  @keyframes dsu-toastin { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
  .dsu-toast { animation: dsu-toastin .35s cubic-bezier(.2,.9,.2,1) both; }
  @keyframes dsu-sheetin { from { transform:translateY(100%); } to { transform:none; } }
  .dsu-sheet { animation: dsu-sheetin .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes dsu-fadeonly { from { opacity:0; } to { opacity:1; } }
  .dsu-fade.dsu-sheet ~ * {}
  @keyframes dsu-loadbar { from { width:0; } to { width:100%; } }
  .dsu-load { animation: dsu-loadbar 1.9s ease-out both; }
  @keyframes dsu-indefmove { 0%{ transform:translateX(-120%);} 100%{ transform:translateX(320%);} }
  .dsu-indef { animation: dsu-indefmove 1.1s ease-in-out infinite; }
  .dsu-bar { will-change: width; }
</style>
</head>

  <div id="root"></div>
